<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora Hub — Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      color: #111827;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
    }

    #message {
      margin-top: 15px;
      color: #dc2626;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Nexora Hub</h1>

    <p class="subtitle">
      Admin Dashboard Login
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>
    const SUPABASE_URL =
      "https://izjrazugqbnijzhlxegp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_wOVNCGI_o5XwCISbgUK9Sw_r8iMXn7R";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";
        message.textContent = "";

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {

          message.textContent =
            error.message;

          loginButton.disabled = false;
          loginButton.textContent = "Sign In";

          return;
        }

        window.location.href = "admin.html";
      }
    );
  </script>

</body>
</html>
