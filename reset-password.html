<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nexora Hub — Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #2563eb;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #d9dee8;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.7;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      Nexora<span>Hub</span>
    </div>

    <div class="subtitle">
      Create a new admin password
    </div>

    <form id="resetForm">

      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="8"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="8"
        required
      >

      <button
        type="submit"
        id="resetButton"
      >
        Update Password
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>

    const SUPABASE_URL =
      "https://izjrazugqbnijzhlxegp.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_wOVNCGI_o5XwCISbgUK9Sw_r8iMXn7R";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const resetForm =
      document.getElementById("resetForm");

    const resetButton =
      document.getElementById("resetButton");

    const message =
      document.getElementById("message");

    resetForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

          message.textContent =
            "Passwords do not match.";

          return;
        }

        resetButton.disabled = true;
        resetButton.textContent =
          "Updating...";

        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {

          message.textContent =
            error.message;

          resetButton.disabled = false;
          resetButton.textContent =
            "Update Password";

          return;
        }

        message.style.color =
          "#16a34a";

        message.textContent =
          "Password updated successfully.";

        setTimeout(function() {
          window.location.href = "login.html";
        }, 1500);

      }
    );

  </script>

</body>
  </html>
